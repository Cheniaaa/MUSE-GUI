[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-gui"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
where = ["src"]
include = ["muse_gui", "muse_gui.*"]
namespaces = false

[tool.setuptools.package-data]
muse_gui = ["assets/Icon/AppIcon.png"]
